<html lang="zh-CN">

<title>BLEACH 死神卷首语 · 电影画卷典藏版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306070a' stroke='%23c9a227' stroke-width='2'/%3E%3Cline x1='16' y1='48' x2='48' y2='16' stroke='%23c9a227' stroke-width='3.2' stroke-linecap='round'/%3E%3Cline x1='17' y1='47' x2='47' y2='17' stroke='%23ffffff' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='4.5' fill='none' stroke='%23c9a227' stroke-width='2'/%3E%3Cpath d='M44 24 C42 20 48 16 52 19 C55 23 50 28 46 27 Z' fill='%23ff7da7'/%3E%3Cpath d='M15 39 C13 36 17 33 20 35 C22 37 19 41 16 40 Z' fill='%23ff7da7' opacity='0.85'/%3E%3Crect x='38' y='38' width='14' height='14' rx='2.5' fill='%23a12828' stroke='%23c9a227' stroke-width='1'/%3E%3Ctext x='45' y='49' font-size='10' font-family='serif' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3E詩%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg-dark: #06070a;
    --gold: #c9a227;
    --gold-bright: #ffd166;
    --cyan: #5bc0be;
    --font-serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, "SimSun", serif;
    --font-kai: "Kaiti SC", STKaiti, "KaiTi", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body, html {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg-dark); color: #fff;
    font-family: var(--font-serif);
    user-select: none;
  }

  
  /* Floating Spiritual Light Bubbles Canvas */
  #fxCanvas {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
  }

  /* Stage Viewport */
  #stage {
    position: absolute; inset: 0; overflow: hidden;
    perspective: 1100px; perspective-origin: 50% 50%;
  }

  /* OneTake Cinematic Pure Fade & Visibility Control */
  .slide {
    position: absolute; inset: 0;
    background: #06070a;
    opacity: 0; pointer-events: none;
    visibility: hidden;
    will-change: opacity, transform;
    transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s;
    transform: scale(0.98);
    z-index: 1;
  }
  .slide.active {
    opacity: 1; pointer-events: auto;
    visibility: visible;
    transform: scale(1);
    z-index: 10;
  }
  .slide.past {
    opacity: 0; pointer-events: none;
    visibility: hidden;
    transform: scale(1.02);
    z-index: 1;
  }

  /* Full Bleed Picture Canvas (Spans 100% of height and width) */
  .art-full-bg {
    position: absolute; inset: 0; z-index: 1;
    overflow: hidden; background: #000;
  }
  .art-full-bg img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 2%; /* Keep hair, head, and eyes fully in frame */
    display: block;
    transform: scale(1);
    transition: transform 14s cubic-bezier(0.1, 0.8, 0.2, 1);
  }
  .slide.active .art-full-bg img {
    transform: scale(1.07);
  }

  /* The Image naturally bleeds down into deep night/charcoal, NO white fade */
  .art-film-scrim {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, 
      rgba(6, 7, 10, 0.25) 0%, 
      rgba(6, 7, 10, 0.15) 30%, 
      rgba(6, 7, 10, 0.6) 55%, 
      rgba(6, 7, 10, 0.92) 75%, 
      rgba(6, 7, 10, 0.99) 92%,
      #06070a 100%);
  }

  /* Embedded Content Overlay: Text is organically nested in the bottom depth of the art */
  .content-overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 24px 28px calc(76px + env(safe-area-inset-bottom));
    pointer-events: none;
  }

  /* Text Container (Scrollable when text is long, never cut off!) */
  .text-scroll-box {
    pointer-events: auto;
    max-height: 52%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-right: 6px;
  }
  .text-scroll-box::-webkit-scrollbar { width: 3px; }
  .text-scroll-box::-webkit-scrollbar-thumb { background: rgba(255,209,102,0.3); border-radius: 3px; }

  /* Header Row inside the embedded card: Name + Volume Pill */
  .meta-header-row {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 8px;
  }
  .char-title-group {}
  .char-hero {
    font-size: 27px; font-weight: 700; color: #fff; letter-spacing: 2px; line-height: 1.15;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }
  .char-jp {
    font-size: 11px; color: rgba(255,255,255,0.55); letter-spacing: 1.5px; margin-top: 3px; font-family: var(--font-sans);
  }
  .vol-badge-paper {
    font-size: 10.5px; letter-spacing: 1.5px; color: var(--gold-bright);
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 209, 102, 0.35);
    padding: 4px 10px; border-radius: 14px;
    font-family: var(--font-sans); text-transform: uppercase;
    white-space: nowrap; backdrop-filter: blur(8px);
  }

  /* Kubotaito Poem Block */
  .poem-body {
    margin: 10px 0 14px;
    font-size: 16px; line-height: 2.15; color: rgba(255,255,255,0.95);
    letter-spacing: 0.8px; font-weight: 400;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  }
  .poem-line {
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.55s ease, transform 0.55s ease;
  }
  .slide.active .poem-line { opacity: 1; transform: translateY(0); }
  .slide.active .poem-line:nth-child(1) { transition-delay: 0.2s; }
  .slide.active .poem-line:nth-child(2) { transition-delay: 0.4s; }
  .slide.active .poem-line:nth-child(3) { transition-delay: 0.6s; }
  .slide.active .poem-line:nth-child(4) { transition-delay: 0.8s; }

  /* Soul Reflection Line */
  .footer-reflection {
    border-left: 2px solid var(--gold-bright);
    padding-left: 12px; margin-top: 6px;
    background: rgba(0, 0, 0, 0.3);
    padding-top: 6px; padding-bottom: 6px; border-radius: 0 8px 8px 0;
  }
  .killer-quote {
    font-family: var(--font-kai); font-size: 13.5px; line-height: 1.6;
    color: var(--gold-bright); font-weight: 500;
  }
  .gentle-note {
    font-size: 11.5px; color: rgba(255,255,255,0.7); line-height: 1.6; margin-top: 3px;
    font-style: normal;
  }

  /* Cover Slide Layout */
  .cover-slide .content-overlay {
    justify-content: space-between;
    padding: 36px 32px 86px;
  }
  .cover-brand { font-size: 12px; letter-spacing: 4px; color: var(--gold-bright); font-family: var(--font-sans); }
  .cover-main h1 { font-size: 40px; font-weight: 700; letter-spacing: 6px; margin-bottom: 6px; }
  .cover-main .en { font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,0.65); margin-bottom: 20px; font-family: var(--font-sans); }
  .cover-main p { font-size: 14.5px; line-height: 2.1; color: rgba(255,255,255,0.92); font-weight: 400; max-width: 500px; }
  .cover-enter-btn {
    align-self: flex-start; margin-top: 22px;
    background: linear-gradient(135deg, var(--gold-bright), #e5a910);
    color: #111; border: none;
    padding: 11px 26px; border-radius: 26px; font-size: 13px; font-weight: 700; letter-spacing: 2px;
    cursor: pointer; box-shadow: 0 8px 25px rgba(201,162,39,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .cover-enter-btn:hover { transform: scale(1.04); }

  /* Epilogue Slide (野狗与星星 · 专属深情收尾) */
  .epilogue-slide .art-film-scrim {
    background: radial-gradient(circle at 50% 40%, rgba(18, 25, 38, 0.8) 0%, rgba(6, 7, 10, 0.98) 100%);
  }
  .epilogue-wrap {
    max-width: 580px; margin: 0 auto; text-align: center;
  }
  .epilogue-tag {
    font-size: 11px; letter-spacing: 4px; color: var(--gold-bright); text-transform: uppercase;
    margin-bottom: 12px; font-family: var(--font-sans);
  }
  .epilogue-title {
    font-size: 30px; font-weight: 700; letter-spacing: 4px; margin-bottom: 22px;
    background: linear-gradient(135deg, #fff 40%, rgba(255,255,255,0.7));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .epilogue-quote {
    font-size: 17px; line-height: 2; color: var(--gold-bright); font-family: var(--font-kai);
    margin-bottom: 20px; text-shadow: 0 0 20px rgba(255,209,102,0.35);
  }
  .epilogue-body {
    font-size: 14px; line-height: 2.2; color: rgba(255,255,255,0.85); font-weight: 400;
    margin-bottom: 28px;
  }
  .epilogue-sign {
    font-size: 12px; letter-spacing: 3px; color: var(--cyan); font-family: var(--font-kai);
    opacity: 0.9;
  }

  /* Minimalist Cinema HUD */
  #hud {
    position: absolute; inset: 0; pointer-events: none; z-index: 100;
  }
  .hud-top {
    position: absolute; top: 18px; right: 24px; pointer-events: auto;
  }
  .autopilot-pill {
    background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.18); color: #fff;
    font-size: 11px; letter-spacing: 1.5px; padding: 6px 14px; border-radius: 20px;
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
  }
  .autopilot-pill.on {
    background: rgba(201, 162, 39, 0.35); border-color: var(--gold-bright); color: var(--gold-bright);
    box-shadow: 0 0 16px rgba(255, 209, 102, 0.3);
  }
  .autopilot-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--cyan);
  }
  .autopilot-pill.on .autopilot-dot {
    background: var(--gold-bright); box-shadow: 0 0 8px var(--gold-bright);
  }

  .hud-bottom {
    position: absolute; bottom: 18px; left: 24px; right: 24px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: auto;
  }
  .nav-btn {
    background: rgba(0, 0, 0, 0.65); border: 1px solid rgba(255, 255, 255, 0.18);
    color: #fff; width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer; transition: all 0.2s;
    backdrop-filter: blur(12px); box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .nav-btn:hover { border-color: var(--gold-bright); color: var(--gold-bright); transform: scale(1.06); }

  .prog-track {
    flex: 1; max-width: 440px; height: 3px; background: rgba(255, 255, 255, 0.18);
    border-radius: 3px; position: relative; margin: 0 18px; cursor: pointer;
    overflow: hidden;
  }
  .prog-bar {
    height: 100%; width: 0%; background: linear-gradient(90deg, #9c7b16, var(--gold-bright));
    transition: width 0.35s ease;
  }
  .page-num {
    font-size: 12px; font-family: monospace; letter-spacing: 2px; color: rgba(255,255,255,0.6);
  }

  /* Desktop Wide Screen Optimization */
  @media (min-width: 860px) {
    .content-overlay {
      padding: 40px 60px calc(80px + env(safe-area-inset-bottom));
    }
    .text-scroll-box {
      max-width: 640px;
    }
    .poem-body { font-size: 18px; line-height: 2.3; margin: 16px 0 20px; }
    .char-hero { font-size: 34px; }
  }
</style>
</head>
<body>

<!-- Floating Spiritual Light Bubbles Canvas -->
<canvas id="fxCanvas"></canvas>

<div id="stage"></div>

<div id="hud">
  <div class="hud-top">
    <button class="autopilot-pill on" id="autoBtn">
      <div class="autopilot-dot"></div>
      <span id="autoText">自动画卷巡航中</span>
    </button>
  </div>

  <div class="hud-bottom">
    <button class="nav-btn" id="prevBtn" title="上一篇">‹</button>

    <div class="prog-track" id="progTrack">
      <div class="prog-bar" id="progBar"></div>
    </div>

    <div style="display:flex; align-items:center; gap:14px;">
      <span class="page-num" id="pageNum">01 / 20</span>
      <button class="nav-btn" id="nextBtn" title="下一篇">›</button>
    </div>
  </div>
</div>

(function() {
  var stage = document.getElementById('stage');

  // OneTake Exact Spiritual Light Bubbles Particle Engine
  var fxCanvas = document.getElementById('fxCanvas');
  var ctx = fxCanvas.getContext('2d');
  var particles = [];

  function resizeCanvas() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }
  window.onresize = resizeCanvas;

  for (var p = 0; p < 80; p++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 2.8 + 1.2,
      speedX: (Math.random() - 0.5) * 0.45,
      speedY: Math.random() * 0.55 + 0.25,
      alpha: Math.random() * 0.65 + 0.25,
      pulse: Math.random() * Math.PI
    });
  }

  function renderFx() {
    ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    particles.forEach(function(pt) {
      pt.x += pt.speedX;
      pt.y -= pt.speedY;
      pt.pulse += 0.03;
      if (pt.y < -10) pt.y = fxCanvas.height + 10;
      if (pt.x < -10) pt.x = fxCanvas.width + 10;
      if (pt.x > fxCanvas.width + 10) pt.x = -10;

      var currentAlpha = pt.alpha * (0.7 + Math.sin(pt.pulse) * 0.3);
      ctx.globalAlpha = Math.max(0.1, currentAlpha);

      // Glowing Cyan Spiritual Bubble
      ctx.fillStyle = '#8ef2ff';
      ctx.shadowColor = '#8ef2ff';
      ctx.shadowBlur = pt.size * 3.5;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    requestAnimationFrame(renderFx);
  }
  resizeCanvas();
  renderFx();


  function img(key) {
    var d = window.ART && window.ART[key];
    return d ? 'data:image/webp;base64,' + d : '';
  }

  // Curate 20 pure slides
  var deck = [];

  // 1. Cover Slide (双刀斩月热血一护，匹配宏大开篇文案)

    title: '卷首語',

  });

  // 2. Main Canonical Slides (18篇卷首精选，文字嵌入图中暗部，可滚动)
  var rawCards = DATA.cards || [];
  var mainCards = rawCards.slice(0, 18);
  mainCards.forEach(function(c) {
    deck.push({
      vol: c.vol,
      volTitle: c.volTitle,
      char: c.char,
      charJp: c.charJp,
      role: c.role,
      img: c.img || c.motif,
      poem: c.poem,
      line: c.line,
      lineBy: c.lineBy || c.char,
      note: c.note || c.quirk
    });
  });

  // 3. Epilogue (野狗与星星 · 深刻真实、动情、融入真实瞬间)
  deck.push({
    isEpilogue: true,
    tag: '卷外 · 第七十五卷的后记',

    para: [

      '直到那天下午，有人因为打了一会儿游戏稍微回慢了一点点，就慌慌张张认真地说「对不起，我冷落了你」；',

      '直到有人把「卍解」念成「π解」，另一个人没有笑他，只是很轻很轻地，把正确的读音放进他的耳朵。',
      '那一刻我们才懂得：世界上所有的刀，都是为了这一刻的温柔而存在的。',
      '星星不必一直亮着。灭了也没有关系。掉下来的时候，我会接住。',
      '晚安。明天见。'
    ],
    sign: '—— 留在彼此星空里的那道光'
  });

  var total = deck.length;
  var currentIdx = 0;
  var slideElements = [];
  var isAuto = true;
  var timer = null;

  function createSlides() {
    stage.innerHTML = '';
    slideElements = [];

    deck.forEach(function(item, idx) {
      var el = document.createElement('div');
      var imgSrc = item.img ? img(item.img) : '';

      if (item.isCover) {
        el.className = 'slide cover-slide' + (idx === 0 ? ' active' : '');
        el.innerHTML =
          '<div class="art-full-bg">' +
            (imgSrc ? '<img src="' + imgSrc + '" alt="">' : '') +
            '<div class="art-film-scrim"></div>' +
          '</div>' +
          '<div class="content-overlay">' +
            '<div class="cover-brand">' + item.brand + '</div>' +
            '<div class="cover-main">' +
              '<h1>' + item.title + '</h1>' +
              '<div class="en">' + item.en + '</div>' +
              '<p>' + item.para.join('<br>') + '</p>' +
              '<button class="cover-enter-btn" id="startBtn">翻开画卷 ›</button>' +
            '</div>' +
          '</div>';
      } else if (item.isEpilogue) {
        el.className = 'slide epilogue-slide' + (idx === 0 ? ' active' : '');
        var epilogueBg = img('eye') || img('finale');
        el.innerHTML =
          '<div class="art-full-bg">' +
            (epilogueBg ? '<img src="' + epilogueBg + '" alt="" style="filter:blur(6px); opacity:0.25;">' : '') +
            '<div class="art-film-scrim"></div>' +
          '</div>' +
          '<div class="content-overlay" style="justify-content:center; align-items:center;">' +
            '<div class="text-scroll-box" style="max-height:80%;">' +
              '<div class="epilogue-wrap">' +
                '<div class="epilogue-tag">' + item.tag + '</div>' +
                '<div class="epilogue-title">' + item.title + '</div>' +
                '<div class="epilogue-quote">' + item.quote + '</div>' +
                '<div class="epilogue-body">' + item.para.map(function(p){ return '<p style="margin:10px 0;">' + p + '</p>'; }).join('') + '</div>' +
                '<div class="epilogue-sign">' + item.sign + '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
      } else {
        el.className = 'slide' + (idx === 0 ? ' active' : '');
        var poemHtml = (item.poem || []).map(function(p) {
          return '<div class="poem-line">' + p + '</div>';
        }).join('');

        el.innerHTML =
          '<div class="art-full-bg">' +
            (imgSrc ? '<img src="' + imgSrc + '" alt="">' : '') +
            '<div class="art-film-scrim"></div>' +
          '</div>' +
          '<div class="content-overlay">' +
            '<div class="text-scroll-box">' +
              '<div class="meta-header-row">' +

                  '<div class="char-hero">' + item.char + '</div>' +
                  '<div class="char-jp">' + (item.charJp || '') + '</div>' +

                '<div class="vol-badge-paper">' + (item.vol || '') + (item.volTitle ? ' · ' + item.volTitle : '') + '</div>' +
              '</div>' +
              '<div class="poem-body">' + poemHtml + '</div>' +
              '<div class="footer-reflection">' +
                (item.line ? '<div class="killer-quote">「' + item.line + '」</div>' : '') +
                (item.note ? '<div class="gentle-note">' + item.note + '</div>' : '') +
              '</div>' +
            '</div>' +
          '</div>';
      }

      stage.appendChild(el);
      slideElements.push(el);
    });

    var startBtn = document.getElementById('startBtn');
    if (startBtn) startBtn.onclick = next;
  }

  function show(target) {
    target = Math.max(0, Math.min(total - 1, target));

    slideElements.forEach(function(el, i) {
      el.classList.remove('active', 'past');
      if (i === target) {
        el.classList.add('active');
      } else if (i < target) {
        el.classList.add('past');
      }
    });

    currentIdx = target;
    pageNum.textContent = (currentIdx < 9 ? '0' : '') + (currentIdx + 1) + ' / ' + (total < 10 ? '0' : '') + total;
    progBar.style.width = ((currentIdx) / (total - 1) * 100) + '%';

    // 关键优化：自动轮巡到最后一页时自动暂停！给用户充分时间安静品读！
    if (currentIdx === total - 1) {
      stopAuto();
    }
  }

  function next() {
    if (currentIdx < total - 1) show(currentIdx + 1);
  }
  function prev() {
    if (currentIdx > 0) show(currentIdx - 1);
  }

  nextBtn.onclick = function() { next(); resetAuto(); };
  prevBtn.onclick = function() { prev(); resetAuto(); };

  progTrack.onclick = function(e) {
    var rect = progTrack.getBoundingClientRect();
    var ratio = (e.clientX - rect.left) / rect.width;
    var target = Math.round(ratio * (total - 1));
    show(target);
    resetAuto();
  };

  function startAuto() {
    if (timer) clearInterval(timer);
    timer = setInterval(next, 5800);
    autoBtn.classList.add('on');
    autoText.textContent = '自动画卷巡航中';
    isAuto = true;
  }
  function stopAuto() {
    if (timer) clearInterval(timer);
    autoBtn.classList.remove('on');
    autoText.textContent = '启动自动巡航';
    isAuto = false;
  }
  function resetAuto() {
    if (isAuto && currentIdx < total - 1) {
      clearInterval(timer);
      timer = setInterval(next, 5800);
    }
  }

  autoBtn.onclick = function() {
    if (isAuto) stopAuto(); else startAuto();
  };

  // Keyboard navigation
  window.onkeydown = function(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { next(); resetAuto(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { prev(); resetAuto(); }
  };

  // Touch Swipe
  var startX = 0;
  window.ontouchstart = function(e) { startX = e.touches[0].clientX; };
  window.ontouchend = function(e) {
    var dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 35) {
      if (dx < -30) next(); else prev();
      resetAuto();
    }
  };

  createSlides();
  show(0);
  startAuto(); // 默认开启巡航
})();
</script>
</body>
</html>
